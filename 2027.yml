  notes:
  - Workbook damping entries are blank; inherit Orion shock damping and infer an effective
    roll motion ratio from the workbook roll rates.
  - CG height is interpreted as total-car height; sprung height is derived using inherited
    unsprung CG heights.
  - Workbook effective roll rates are used directly; no additional tire vertical compliance
    is added.
  - No full 2027 suspension hardpoints were supplied. Orion hardpoints remain a provisional
    geometry template.
  - Only FrameTorsionEval reads these effective stiffness and roll-center overrides.
    Standard BobSim/Modelica workflows still derive them from provisional geometry.
  - Control-arm masses count as sprung, matching the BobSim reduced mass projection.
  - Roll damping = inherited shock damping * workbook effective spring roll stiffness
    / coil spring stiffness; approximate effective motion ratio.
  - Combined sprung roll inertia is apportioned by sprung axle mass, then shifted
    to each roll center. This is an assumed mode shape.
  - Aero and nonlinear tire/load feedback are excluded from this screening model.
