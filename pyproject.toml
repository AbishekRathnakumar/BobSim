[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
files = [
    "_0_Utils",
    "_1_VisualSim",
    "_2_EnvelopeSim",
    "_3_StandardSim",
    "_4_OptSim",
    "_5_App",
    "tests",
]

exclude = '''
(^|/)build/
|(^|/)__pycache__/
|(^|/)\.venv/
|(^|/)_0_Utils/external/BobLib/
'''

[[tool.mypy.overrides]]
module = ["vtk.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pyvista.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "_0_Utils.kin_py.suspension_model.*",
    "tests.kin_py.*",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
