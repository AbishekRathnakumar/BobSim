name: CI

on:
  workflow_dispatch:
  # Every branch, not just main: long-lived integration branches (DOE, envelope
  # work) otherwise drift out of sync and only fail at merge time.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, Type check and Tests are separate jobs because the protect-main
  # ruleset requires them as named status checks. Each now runs exactly once:
  # previously the Docker job re-ran `make ci`, duplicating all three.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run ruff
        run: make lint RUN=

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run mypy
        run: make typecheck RUN=

  # Runs natively rather than in the image: every test that needs OpenModelica
  # is gated on regression artifacts CI never generates, so the container added
  # no coverage here -- only an image build.
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run pytest
        run: make test RUN=

  # Proves the environment users actually run in still works: the image builds,
  # omc is functional, and the DOE pipeline runs inside it. Full StandardSim
  # baselines stay out of CI -- they exceed hosted runner limits (CONTRIBUTING).
  container:
    name: Container toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only where it pays for itself: the image build is the expensive step.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build BobSim image
        run: docker compose build bobsim

      - name: Verify OpenModelica toolchain
        run: docker compose run --rm -T bobsim omc --version

      - name: Check DOE pipeline in-image
        run: make opt-doe-smoke
