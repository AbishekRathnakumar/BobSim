name: CI

on:
  workflow_dispatch:
  # Every branch, not just main: long-lived integration branches (DOE, envelope
  # work) otherwise drift out of sync and only fail at merge time.
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, and the whole pytest suite in one job. These share a checkout
  # and a dependency install, and none of them need OpenModelica: every test
  # that does is gated on regression artifacts CI never generates.
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run fast gate
        run: make ci RUN=

  # The unit tests above never touch the toolchain, so this job exists to prove
  # the environment users actually run in still works: the image builds, omc is
  # functional, and the DOE pipeline runs inside it. Full StandardSim baselines
  # stay out of CI — they exceed hosted runner limits (see CONTRIBUTING.md).
  container:
    name: Container toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only where it pays for itself: the image build is the expensive step.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build BobSim image
        run: docker compose build bobsim

      - name: Verify OpenModelica toolchain
        run: docker compose run --rm -T bobsim omc --version

      - name: Check DOE pipeline in-image
        run: make opt-doe-smoke
